name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  release-gates:
    name: ${{ matrix.label }} / CPython ${{ matrix.python }}${{ matrix.windows_note }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, python: '3.13', label: ubuntu-24.04-x64, shell: bash, windows_note: '' }
          - { runner: ubuntu-24.04, python: '3.14', label: ubuntu-24.04-x64, shell: bash, windows_note: '' }
          - { runner: macos-15-intel, python: '3.13', label: macos-15-intel, shell: bash, windows_note: '' }
          - { runner: macos-15-intel, python: '3.14', label: macos-15-intel, shell: bash, windows_note: '' }
          - { runner: macos-15, python: '3.13', label: macos-15-arm64, shell: bash, windows_note: '' }
          - { runner: macos-15, python: '3.14', label: macos-15-arm64, shell: bash, windows_note: '' }
          - { runner: windows-2025, python: '3.13', label: windows-server-x64, shell: pwsh, windows_note: ' — compatibility evidence, not Windows 11 desktop validation' }
          - { runner: windows-2025, python: '3.14', label: windows-server-x64, shell: pwsh, windows_note: ' — compatibility evidence, not Windows 11 desktop validation' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run fail-closed release gates (Linux/macOS)
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-release.txt -r requirements-dev.txt
          python -m uv export --locked --all-extras --no-emit-project --format requirements-txt --output-file .ci-requirements.txt
          python -m pip download --only-binary=:all: --dest .ci-wheelhouse -r .ci-requirements.txt
          python scripts/build_release_artifacts.py --output .ci-dist-a --source-date-epoch 0
          python scripts/build_release_artifacts.py --output .ci-dist-b --source-date-epoch 0
          python scripts/verify_release_cell.py --wheel .ci-dist-a/autopulse-0.1.0-py3-none-any.whl --sdist .ci-dist-a/autopulse-0.1.0.tar.gz --wheelhouse .ci-wheelhouse --locked-requirements .ci-requirements.txt --summary .ci-summary.md --manifest-output .ci-wheelhouse.json
          python -m pip install .
          python scripts/generate_supply_chain_evidence.py --target-python python --wheel .ci-dist-a/autopulse-0.1.0-py3-none-any.whl --wheelhouse-manifest .ci-wheelhouse.json --locked-requirements .ci-requirements.txt --commit ${{ github.sha }} --output .ci-evidence --package autopulse --package jsonschema
          python -m pytest -q
      - name: Run fail-closed release gates (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -r requirements-release.txt -r requirements-dev.txt
          python -m uv export --locked --all-extras --no-emit-project --format requirements-txt --output-file .ci-requirements.txt
          python -m pip download --only-binary=:all: --dest .ci-wheelhouse -r .ci-requirements.txt
          python scripts/build_release_artifacts.py --output .ci-dist-a --source-date-epoch 0
          python scripts/build_release_artifacts.py --output .ci-dist-b --source-date-epoch 0
          python scripts/verify_release_cell.py --wheel .ci-dist-a/autopulse-0.1.0-py3-none-any.whl --sdist .ci-dist-a/autopulse-0.1.0.tar.gz --wheelhouse .ci-wheelhouse --locked-requirements .ci-requirements.txt --summary .ci-summary.md --manifest-output .ci-wheelhouse.json
          python -m pip install .
          python scripts/generate_supply_chain_evidence.py --target-python python --wheel .ci-dist-a/autopulse-0.1.0-py3-none-any.whl --wheelhouse-manifest .ci-wheelhouse.json --locked-requirements .ci-requirements.txt --commit ${{ github.sha }} --output .ci-evidence --package autopulse --package jsonschema
          python -m pytest -q
      - name: Emit allowlist-built summary
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          python scripts/emit_ci_summary.py --source .ci-summary.md --commit ${{ github.sha }} --output $GITHUB_STEP_SUMMARY
      - name: Emit allowlist-built summary (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/emit_ci_summary.py --source .ci-summary.md --commit ${{ github.sha }} --output $env:GITHUB_STEP_SUMMARY

  docs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: grubby-galaxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: grubby-galaxy/.nvmrc
          cache: npm
          cache-dependency-path: grubby-galaxy/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run test:e2e
