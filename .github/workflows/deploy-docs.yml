name: Deploy Starlight to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/specs/**'
      - 'grubby-galaxy/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Validate and upload
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
      artifact-id: ${{ steps.upload.outputs.artifact_id }}
    defaults:
      run:
        shell: bash
        working-directory: grubby-galaxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: grubby-galaxy/.nvmrc
          cache: npm
          cache-dependency-path: grubby-galaxy/package-lock.json
      - run: npm ci
      - run: npm run validate:docs
      - name: Bind artifact to this validated revision and run
        id: identity
        run: echo "artifact-name=github-pages-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload validated bytes without rebuilding
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: grubby-galaxy/dist
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.build.outputs.artifact-id != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy this run's validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}
